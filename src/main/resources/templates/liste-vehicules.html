<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AutoLoc - Louer une voiture</title>
    <style>
        body { font-family: Arial; background: #2c3e50; color: white; padding: 20px; }
        .card { background: #34495e; padding: 15px; margin: 10px; border-radius: 8px; }
        .btn { background: #1abc9c; color: white; padding: 10px; border: none; cursor: pointer; }
        input { padding: 8px; margin: 5px; }
    </style>
</head>
<body>
<h1>Véhicules disponibles à la location</h1>
<div th:if="${param.success}" style="color: lightgreen;">Réservation effectuée avec succès !</div>

<div th:each="v : ${vehicules}" class="card">
    <h3 th:text="${v.marque} + ' ' + ${v.modele}"></h3>
    <p>Immatriculation : <span th:text="${v.immatriculation}"></span></p>
    <p>Prix : <span th:text="${v.tarifJournalier}"></span> € / jour</p>

    <form th:action="@{/client/louer/{id}(id=${v.idVehicle})}" method="post">
        <input type="email" name="emailClient" placeholder="Votre email" required>
        <button type="submit" class="btn">Louer ce véhicule</button>
    </form>
</div>
</body>
</html>
