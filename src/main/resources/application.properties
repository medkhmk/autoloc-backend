spring.application.name=autoloc-api

# Connexion à la base de données MySQL (MAMP utilise le port 8889)
spring.datasource.url=jdbc:mysql://localhost:8889/autoloc_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.fr.ece.autoloc_api=INFO